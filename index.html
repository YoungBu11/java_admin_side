<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroMET Admin Portal</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <style>
        body {
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #162c26;
        }
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background: linear-gradient(135deg, #2e6d4a 80%, #3ca86a 100%);
            border-radius: 18px;
            padding: 36px 32px 28px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1.5px solid #1b4d3e;
            position: relative;
        }
        .logo {
            text-align: center;
            margin-bottom: 18px;
        }
        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }
        .logo .bolt {
            font-size: 2.2rem;
            color: #ffe600;
            margin-bottom: 6px;
            display: block;
        }
        .logo h1 {
            font-size: 2rem;
            margin: 0;
            color: #fff;
            font-weight: 700;
        }
        .logo .subtitle {
            color: #1aff8e;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .secure-badge {
            display: inline-block;
            background: #0e2e1c;
            color: #13b464;
            border-radius: 18px;
            padding: 6px 18px;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 18px;
            border: 1.5px solid #13b464;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 6px;
            font-weight: 600;
            color: #b6fcd5;
            font-size: 0.98rem;
        }
        input[type="text"], input[type="password"] {
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 7px;
            border: none;
            background: #0e2e1c;
            color: #fff;
            font-size: 1.08rem;
            outline: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        .password-group {
            display: flex;
            align-items: center;
            background: #0e2e1c;
            border-radius: 7px;
            margin-bottom: 16px;
        }
        .password-group input {
            flex: 1;
            border: none;
            background: transparent;
            margin-bottom: 0;
        }
        .password-toggle {
            background: none;
            border: none;
            color: #b6fcd5;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: 500;
            color: #b6fcd5;
            margin-bottom: 0;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: #1aff8e;
            margin-right: 7px;
        }
        .emergency-access {
            color: #ff4444;
            text-decoration: underline;
            font-size: 0.98rem;
            cursor: pointer;
            margin-left: 8px;
        }
        .login-btn {
            background: #1aff8e;
            color: #003c1a;
            border: none;
            border-radius: 7px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(26,255,142,0.08);
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #13e67b;
        }
        #successMessage {
            display: none;
            background: #1aff8e;
            color: #003c1a;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            border: 1.5px solid #1aff8e;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="images/logo.png" alt="Logo" style="width: 200px; height: auto; margin-bottom: 2px; transform: rotate(0deg); max-height: 350px; opacity: 1;">
            <div style="color: #13b464; font-size: 1.3rem; font-weight: 700; margin-top: 6px; margin-bottom: 2px; letter-spacing: 1px;">ADMIN PORTAL</div>
        </div>
        <div style="text-align: center;">
            <span class="secure-badge">🔒 SECURE ACCESS</span>
        </div>
        <form id="loginForm">
            <label for="adminId">ADMINISTRATOR ID</label>
            <input type="text" id="adminId" name="adminId" value="admin" required>
            <label for="password">MASTER PASSWORD</label>
            <div class="password-group">
                <input type="password" id="password" name="password" value="" required>
                <button type="button" class="password-toggle" tabindex="-1">👁</button>
            </div>
            <div class="checkbox-group">
                <label><input type="checkbox" checked> Maintain Session</label>
                <a href="#" class="emergency-access">emergency access</a>
            </div>
            <button type="submit" class="login-btn">ACCESS CONTROL PANEL</button>
            <div id="successMessage">Authentication successful! Redirecting...</div>
        </form>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
